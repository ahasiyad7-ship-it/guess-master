<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game</title>
<style>
    body{
        background: linear-gradient(to right, #ff00cc, #333399);
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .box{
        background: white;
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        width: 330px;
        box-shadow: 0 10px 30px black;
    }
    h1{ color: #333399; margin-top: 0; }
    input{
        padding: 12px;
        width: 80%;
        border-radius: 10px;
        border: 2px solid #333399;
        font-size: 18px;
        text-align: center;
        outline: none;
    }
    button{
        padding: 12px 25px;
        margin-top: 15px;
        background: #ff00cc;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 17px;
        cursor: pointer;
    }
    button:hover{ background: #333399; }
    #result{ font-size: 20px; font-weight: bold; margin-top: 15px; }
    #hint{ font-size: 16px; color: orange; font-weight: bold; }
    #score{ font-size: 18px; color: green; font-weight: bold; }
</style>
</head>
<body>

<div class="box">
    <h1>🎯 Guess The Number</h1>
    <p>Guess a number between 0 to 9</p>
    <input id="guessnumber" type="number" placeholder="Enter number">
    <br>
    <button onclick="check()">Check</button>
    <button onclick="playagain()" style="background: green;">Play Again</button>

    <p id="result">Result will show here</p>
    <p id="hint"></p>
    <p id="score">Score : 10</p>
</div>

<script>
    var guess = document.getElementById("guessnumber")
    var result = document.getElementById("result")
    var hint = document.getElementById("hint")
    var score = document.getElementById("score")
    var randomnumber = Math.floor(Math.random()*10)
    var totalscore = 10

    function check()
    {
        var enterednumber = Number(guess.value)

        if(randomnumber == enterednumber)
        {
            result.textContent = "🎉 Correct! You Won!"
            result.style.color = "green"
            hint.textContent = ""
            alert("You Won!")
        }
        else
        {
            totalscore = totalscore - 1
            score.textContent = "Score : " + totalscore
            result.textContent = "❌ Wrong! Try Again!"
            result.style.color = "red"

            // Hint Logic
            if(enterednumber > randomnumber){
                hint.textContent = "Hint: Try a Smaller Number 👇"
            } else {
                hint.textContent = "Hint: Try a Bigger Number 👆"
            }

            if(totalscore == 0){
                result.textContent = "😢 Game Over! Number was " + randomnumber
                hint.textContent = ""
                alert("Game Over!")
            }
        }
    }

    function playagain()
    {
        randomnumber = Math.floor(Math.random()*10)
        totalscore = 10
        score.textContent = "Score : 10"
        result.textContent = "Result will show here"
        hint.textContent = ""
        guess.value = ""
    }
</script>

</body>
</html>
